<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARNITAS DON LOPE - POS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌮</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@400;500;600;700;800;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --bg:#1a1310; --surface:#2d221c; --line:#4a3c31; --carnitas:#c0572c; --naranja:#e67e22; --dorado:#d4af37; }
    body { background-color:var(--bg); font-family:'Inter',sans-serif; }
    .font-display { font-family:'Baloo 2',cursive; }
    .grill-bg { background:repeating-linear-gradient(45deg,rgba(192,87,44,.04) 0,rgba(192,87,44,.04) 1px,transparent 1px,transparent 20px); }
    .product-card:hover { transform:translateY(-2px); box-shadow:0 8px 16px -8px rgba(0,0,0,.5); }
  </style>
</head>
<body class="text-zinc-100">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-[#181410] border-b border-[#3a2e20] p-4 flex justify-between items-center">
      <div class="font-display text-xl text-white">CARNITAS <span class="text-[#c0572c]">DON LOPE</span></div>
      <button onclick="toggleCart()" class="w-10 h-10 rounded-full bg-[#c0572c] flex items-center justify-center"><i data-lucide="shopping-cart"></i></button>
    </header>

    <!-- Menú -->
    <div id="menu-section" class="flex-1 overflow-y-auto p-4">
      <h2 class="font-display text-2xl mb-6 text-center">MENÚ DEL DÍA</h2>
      <div id="products" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
    </div>

    <!-- Carrito -->
    <div id="cart-section" class="fixed inset-0 bg-black/80 z-50 hidden">
      <div class="absolute bottom-0 w-full bg-[#181410] max-h-80 overflow-y-auto p-4">
        <h3 class="font-display text-lg mb-3">Carrito</h3>
        <div id="cart-items" class="space-y-2 mb-4"></div>
        <div class="border-t border-[#3a2e20] pt-4 mb-4">
          <div class="flex justify-between font-bold text-xl">
            <span>Total:</span>
            <span id="cart-total" class="text-[#c0572c]">Bs. 0.00</span>
          </div>
        </div>
        <button id="checkout-btn" class="w-full bg-[#c0572c] hover:bg-[#a63b1a] text-white py-3 rounded font-bold mb-2">
          Cobrar en efectivo
        </button>
        <button onclick="toggleCart()" class="w-full bg-[#2d221c] hover:bg-[#3a2e20] text-white py-3 rounded">Cerrar</button>
      </div>
    </div>

    <!-- Modal Cliente -->
    <div id="cliente-modal" class="fixed inset-0 bg-black/80 z-50 hidden">
      <div class="absolute center bg-[#181410] p-6 rounded w-11/12 max-w-sm">
        <h3 class="font-display text-lg mb-4">Cliente</h3>
        <input type="text" id="cliente-nombre" placeholder="Nombre" class="bg-[#2d221c] text-white px-3 py-2 rounded mb-3 w-full">
        <input type="text" id="cliente-cel" placeholder="Celular" class="bg-[#2d221c] text-white px-3 py-2 rounded mb-4 w-full">
        <div class="flex gap-2">
          <button onclick="guardarVenta('Efectivo')" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded">Efectivo</button>
          <button onclick="guardarVenta('Tarjeta')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">Tarjeta</button>
          <button onclick="toggleCart()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 rounded">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuración - REEMPLAZA con tu URL de Google Apps Script
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbytJfTFwZehK4KBAWWhvVljnLDYq2sY61P3tGOeEbGKnf921xSX1QT0uOWCPh9uhyNq/exec';
    
    // Estado del carrito
    let cart = [];
    let currentProduct = null;

    // Inicializar
    window.onload = function() {
      loadMenu();
      lucide.createIcons();
    };

    // Cargar menú desde Google Sheets
    async function loadMenu() {
      const productsDiv = document.getElementById('products');
      productsDiv.innerHTML = '<p class="col-span-full text-center text-zinc-500">Cargando menú...</p>';
      
      try {
        const response = await fetch(GAS_URL + '?action=getMenu');
        const data = await response.json();
        
        if (data.error) throw new Error(data.error);
        
        productsDiv.innerHTML = data.map(p => `
          <div class="bg-[#181410] border border-[#3a2e20] rounded-lg p-4 product-card">
            <h3 class="font-bold text-lg">${p.nombre}</h3>
            <p class="text-sm text-zinc-400">${p.categoria}</p>
            <p class="text-[#c0572c] font-bold text-xl mt-2">Bs. ${p.precio.toFixed(2)}</p>
            ${p.imagenUrl ? `<img src="${p.imagenUrl}" class="w-full mt-3 rounded">${p.disponible ? '' : '<span class="text-red-400 text-xs">Agotado</span>'}` : ''}
            <button onclick="addToCart(${JSON.stringify(p)})" class="mt-3 w-full bg-[#c0572c] hover:bg-[#a63b1a] text-white py-2 rounded font-bold">Añadir al carrito</button>
          </div>
        `).join('');
      } catch(e) {
        productsDiv.innerHTML = '<p class="col-span-full text-center text-red-400">Error: ' + e.message + '</p>';
      }
    }

    // Carrito
    function addToCart(product) {
      if (!product.disponible) return;
      cart.push(product);
      updateCart();
    }

    function updateCart() {
      document.getElementById('cart-total').textContent = 'Bs. ' + cart.reduce((t, p) => t + p.precio, 0).toFixed(2);
      const cartDiv = document.getElementById('cart-items');
      if (cart.length === 0) {
        cartDiv.innerHTML = '<p class="text-center text-zinc-500 py-4">Carrito vacío</p>';
        return;
      }
      cartDiv.innerHTML = cart.map((p, i) => `
        <div class="flex justify-between items-center">
          <span class="text-sm">${p.nombre}</span>
          <button onclick="removeCart(${i})" class="text-red-400">×</button>
        </div>
      `).join('');
    }

    function removeCart(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function toggleCart() {
      document.getElementById('cart-section').classList.toggle('hidden');
    }

    // Checkout
    function guardarVenta(metodoPago) {
      if (cart.length === 0) return;
      
      const venta = {
        action: 'registrarVenta',
        datos: {
          clienteNombre: document.getElementById('cliente-nombre').value || 'Cliente',
          clienteCelular: document.getElementById('cliente-cel').value || '',
          detalleJson: cart.map(p => p.nombre).join(' | '),
          metodoPago: metodoPago,
          tipoConsumo: 'En el Local',
          sucursalId: 'carnitas-principal',
          sucursalNombre: 'Carnitas Don Lope'
        }
      };
      
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(venta)
      }).then(() => {
        cart = [];
        updateCart();
        toggleCart();
        document.getElementById('cliente-modal').classList.add('hidden');
        alert('¡Venta registrada!');
      }).catch(() => alert('Error al registrar venta'));
    }

    // Modal cliente
    document.getElementById('checkout-btn').onclick = () => {
      document.getElementById('cliente-modal').classList.remove('hidden');
    };
  </script>
</body>
</html>
