<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Carnitas Don Lope POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@400;500;600;700;800;800&display=swap" rel="stylesheet">
<style>:root{--bg:#1a1310;--surface:#2d221c;--carnitas:#c0572c;--naranja:#e67e22}.font-display{font-family:'Baloo 2',cursive}</style>
</head><body class="bg-[#1a1310] text-zinc-100"><div id="app" class="flex items-center justify-center min-h-screen p-4">
<div id="login" class="text-center"><h1 class="font-display text-3xl mb-4">CARNITAS <span class="text-[#c0572c]">DON LOPE</span></h1>
<input id="branch" placeholder="ID sucursal" class="bg-[#181410] px-4 py-2 mb-3 rounded w-full max-w-xs"><br>
<input id="pass" type="password" placeholder="Contraseña" class="bg-[#181410] px-4 py-2 mb-3 rounded w-full max-w-xs"><br>
<button onclick="start()" class="bg-[#c0572c] hover:bg-[#a63b1a] px-6 py-2 rounded font-bold">Entrar</button>
</div><div id="pos" class="hidden w-full max-w-4xl">
<h2 class="font-display text-2xl mb-4" id="title"></h2>
<div id="products" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
</div></body>
<script>const GAS='https://script.google.com/macros/s/AKfycbzPmD1E4kH59Fy2Epnf86WFP0FJBVfm1jhqCMWP6WUytaf-M2nL6XbFxmH7Eu0Df5JG/exec';
function start(){const id=document.getElementById('branch').value;if(!id)return alert('Ingresa ID');localStorage.setItem('carnitas_branch',id);document.getElementById('login').classList.add('hidden');document.getElementById('pos').classList.remove('hidden');document.getElementById('title').textContent=id;loadMenu();}
async function loadMenu(){const r=await fetch(GAS+'?action=getMenu&sucursal='+localStorage.getItem('carnitas_branch'));const d=await r.json();document.getElementById('products').innerHTML=d.map(p=>'<div class="bg-[#181410] p-3 rounded"><h3 class="font-bold">'+p.nombre+'</h3><p class="text-[#c0572c]">Bs. '+p.precio+'</p></div>').join('');}
